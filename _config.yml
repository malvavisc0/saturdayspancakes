title: Saturday's Pancakes
author: Malvavisc0
description: >-
  Saturdays Pancakes is a personal blog about artificial intelligence,
  technology, and the ideas at the edges — written by Malvavisc0.
url: https://saturdayspancakes.de
baseurl: "" # the subpath of your site, e.g. /blog
twitter_username: minimalvavisco
github_username:  malvavisc0

theme_config:
  date_format: "%Y-%m-%d"
  show_description: true
  back_home_text: "← home"

permalink: /post/:year/:month/:day/:slug.html

exclude:
  - .jektex-cache

favicon: "assets/logo.png"

sass:
  style: compressed

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]